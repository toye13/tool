<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord 多機能ツール サービス休止のお知らせ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background:#202225; color:#dcddde; font-family:'Whitney',sans-serif; padding:20px; margin:0; text-align:center; }
        .container { max-width:900px; margin:0 auto; }
        header { padding:40px 20px; border-bottom:1px solid #36393f; }
        h1 { color:#ed4245; font-size:2.5em; }
        .warning-card { background:#992d22; border:4px solid #ed4245; border-radius:12px; padding:40px; margin:60px 0; }
        .warning-icon { font-size:4em; color:#ed4245; margin-bottom:20px; }
        .warning-title { font-size:2em; font-weight:bold; color:#ed4245; margin-bottom:20px; }
        .info-text { font-size:1.3em; line-height:1.8; margin:30px 0; }
        .important { color:#ff6666; font-weight:bold; }
        .footer { margin-top:50px; font-size:1.1em; color:#b9bbbe; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fab fa-discord"></i> Discord 多機能ツール</h1>
        </header>

        <div class="warning-card">
            <div class="warning-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="warning-title">
                サービスを無期限休止いたします
            </div>
            <div class="info-text">
                当サービスにDiscord利用規約違反の可能性がある機能が含まれており、<br>
                また複数のユーザー様から<strong class="important">「ツール使用後にアカウントが即時BANされた」</strong>というご報告をいただきました。<br><br>

                皆様のアカウント安全を最優先に考慮した結果、<br>
                <strong class="important">当サービスを即時かつ無期限で休止</strong>させていただきます。<br><br>

                すでにツールをお持ちの方は、<br>
                <strong class="important">即時削除</strong>を強くおすすめいたします。<br><br>

                ご利用いただいた皆様には大変ご迷惑をおかけしましたことを、<br>
                深くお詫び申し上げます。
            </div>

            <div class="footer">
                ── Discord 多機能ツール 運営 ──<br>
                2026年1月9日
            </div>
        </div>
    </div>
</body>
</html>
